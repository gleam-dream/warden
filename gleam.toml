name = "warden"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licences = ["Apache-2.0"]
description = "A typed Gleam OIDC / OAuth 2.0 Relying Party on gose, with an owned bounded HTTPS transport."
repository = { type = "github", user = "gleam-dream", repo = "warden" }
internal_modules = ["warden/internal", "warden/internal/*"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
telemetry = "== 1.4.2"
exception = "== 2.1.1"
gleam_crypto = "== 1.6.0"
gleam_time = "== 1.11.0"
gose = "== 2.2.0"
kryptos = "== 1.5.0"
sinal = { path = "../sinal" }

[dev-dependencies]
# Test-only oracles: raw oidcc for the differential and probes (design V4),
# erlang-jose for the scripted provider's token signing.
oidcc = "== 3.9.0"
jose = "== 1.11.12"
telemetry_registry = "== 0.3.2"
gleeunit = ">= 1.0.0 and < 2.0.0"
