# Mount a certificate from Warden's disposable test CA for
# localhost.emobix.co.uk, so the relying party verifies the suite's TLS with
# an explicit test trust anchor instead of accepting a self-signed cert.
services:
  nginx:
    volumes:
      - ../../build/test-pki/conformance.pem:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ../../build/test-pki/conformance.key:/etc/ssl/private/nginx-selfsigned.key:ro
