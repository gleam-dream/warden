# Disposable Dex configuration for Warden interoperability tests.
issuer: https://localhost:15556/dex
storage:
  type: memory
web:
  https: 0.0.0.0:5556
  tlsCert: /pki/localhost.pem
  tlsKey: /pki/localhost.key
oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]
  passwordConnector: local
expiry:
  idTokens: "10m"
staticClients:
  - id: warden-rp
    name: Warden
    secret: warden-dex-disposable-secret
    redirectURIs:
      - https://localhost:1/callback
enablePasswordDB: true
staticPasswords:
