name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Local gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: warden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: warden
          persist-credentials: false
      - uses: ./warden/.github/actions/siblings
        with:
          include-recipe: "true"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Record source revisions
        run: |
          mkdir -p build/ci
          { git rev-parse HEAD; cat sibling-revisions.txt; } > build/ci/revisions.txt
      - name: Run canonical local gate
        run: |
          set -o pipefail
          nix develop -c scripts/check 2>&1 | tee build/ci/check.log
      - name: Retain local evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warden-local-evidence
          path: warden/build/ci/
          if-no-files-found: error
          retention-days: 14
  ci:
    name: CI
    if: always()
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: test "$GATE_RESULT" = success
