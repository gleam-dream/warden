name: OpenID regression evidence
on:
  workflow_dispatch:
    inputs:
      plans:
        description: Exact comma-separated plans; thirdparty has unresolved independent setup evidence.
        required: true
        default: basic,formpost,config,refresh,logout
      policy:
        description: Strict requires every module PASSED; regression permits exact documented SKIPPED/REVIEW outcomes.
        required: true
        type: choice
        options: [strict, regression]
        default: regression
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: warden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: warden
          persist-credentials: false
      - uses: ./warden/.github/actions/siblings
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Record source revisions
        run: |
          mkdir -p build/ci
          { git rev-parse HEAD; cat sibling-revisions.txt; } > build/ci/revisions.txt
      - name: Prepare independent suite dependencies
        run: |
          google-chrome --version | tee build/ci/browser-version.txt
          nix develop -c sh -c 'cd consumer/browser && npm ci --no-fund --no-audit'
          echo '127.0.0.1 localhost.emobix.co.uk' | sudo tee -a /etc/hosts
      - name: Run selected OpenID plans
        env:
          PLANS: ${{ inputs.plans }}
          WARDEN_CONFORMANCE_POLICY: ${{ inputs.policy }}
        run: |
          set -o pipefail
          nix develop -c scripts/conformance-check "$PLANS" 2>&1 | tee build/ci/conformance.log
      - name: Retain raw module verdicts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warden-openid-regression-evidence
          path: |
            warden/build/ci/
            warden/build/conformance/
          if-no-files-found: error
          retention-days: 30
  conformance-status:
    name: OpenID regression status
    if: always()
    needs: conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: test "$CONFORMANCE_RESULT" = success
