name: Benchmark observations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: warden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: warden
          persist-credentials: false
      - uses: ./warden/.github/actions/siblings
        with:
          client-id: ${{ vars.SIBLINGS_APP_CLIENT_ID }}
          private-key: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && secrets.SIBLINGS_APP_PRIVATE_KEY || '' }}
          read-token: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && secrets.SIBLINGS_READ_TOKEN || '' }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Record source revisions
        run: |
          mkdir -p build/ci
          { git rev-parse HEAD; cat sibling-revisions.txt; } > build/ci/revisions.txt
      - name: Record observations without a latency threshold
        run: nix develop -c scripts/benchmark
      - name: Retain benchmark observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warden-benchmark-observations
          path: |
            warden/build/benchmark/
            warden/build/ci/revisions.txt
          if-no-files-found: error
          retention-days: 30
