name: Pinned sibling checkouts
description: Read fixed private siblings and the public JSON Blueprint at recorded revisions.
inputs:
  include-recipe:
    description: Include Relay and JSON Blueprint for the required consumer recipe.
    required: false
    default: "false"
  client-id:
    description: GitHub App client ID with read access to the three private sibling repositories.
    required: false
    default: ""
  private-key:
    description: GitHub App private key.
    required: false
    default: ""
  read-token:
    description: Optional token limited to reading the private siblings.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Refuse credential use for fork code
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
      shell: bash
      run: |
        echo '::error::Private sibling validation cannot use repository credentials in fork pull requests.'
        exit 1
    - name: Read pinned sibling revisions
      id: pins
      shell: bash
      working-directory: warden
      env:
        INCLUDE_RECIPE: ${{ inputs.include-recipe }}
      run: |
        set -eu
        case "$INCLUDE_RECIPE" in true|false) ;; *) echo "Invalid recipe checkout selection" >&2; exit 1 ;; esac
        while IFS='=' read -r package revision; do
          case "$package" in sinal|http_gun|relay|json_blueprint) ;; *) echo 'Invalid sibling package' >&2; exit 1 ;; esac
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid sibling revision' >&2; exit 1; }
          printf '%s=%s\n' "$package" "$revision" >> "$GITHUB_OUTPUT"
        done < sibling-revisions.txt
        for package in sinal http_gun relay json_blueprint; do
          [[ $(grep -c "^$package=" sibling-revisions.txt) == 1 ]] || { echo 'Missing or duplicate sibling pin' >&2; exit 1; }
        done
    - name: Acquire read-only sibling token
      if: inputs.client-id != '' && inputs.private-key != ''
      id: app
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: gleam-dream
        repositories: ${{ inputs.include-recipe == 'true' && 'sinal,http_gun,relay' || 'sinal,http_gun' }}
        permission-contents: read
    - name: Require private sibling read access
      shell: bash
      env:
        SIBLING_TOKEN: ${{ steps.app.outputs.token || inputs.read-token }}
      run: |
        if [[ -z "$SIBLING_TOKEN" ]]; then
          echo '::error::Configure SIBLINGS_APP_CLIENT_ID and SIBLINGS_APP_PRIVATE_KEY, or a narrowly scoped SIBLINGS_READ_TOKEN.'
          exit 1
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: gleam-dream/sinal
        ref: ${{ steps.pins.outputs.sinal }}
        path: sinal
        token: ${{ steps.app.outputs.token || inputs.read-token }}
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: gleam-dream/http_gun
        ref: ${{ steps.pins.outputs.http_gun }}
        path: http_gun
        token: ${{ steps.app.outputs.token || inputs.read-token }}
        persist-credentials: false
    - if: inputs.include-recipe == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: gleam-dream/relay
        ref: ${{ steps.pins.outputs.relay }}
        path: relay
        token: ${{ steps.app.outputs.token || inputs.read-token }}
        persist-credentials: false
    - if: inputs.include-recipe == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: lostbean/json_blueprint
        ref: ${{ steps.pins.outputs.json_blueprint }}
        path: json_blueprint
        persist-credentials: false
