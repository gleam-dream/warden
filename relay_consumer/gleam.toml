name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Warden; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
warden = { path = ".." }
relay = { path = "../../relay" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
