name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Warden; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
warden = { path = ".." }
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "d6ad27d193d240101c0f1c150b6c731698c9224b" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "9727f9baab6ed4f796780a0c3a1027c3292c5fc7" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
