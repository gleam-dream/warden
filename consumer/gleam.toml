name = "warden_reference"
version = "0.1.0"
target = "erlang"
description = "Reference relying party and API consumer for Warden, using public imports only."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
wisp = "== 2.2.2"
mist = "== 6.0.3"
envoy = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
warden = { path = ".." }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
